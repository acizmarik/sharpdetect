<title>{{title}} — SharpDetect Report</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Cstyle%3E.a{stroke:%233b6fd4} .b{stroke:%23e59a2f} @media (prefers-color-scheme:dark){ .a{stroke:%236b9ef8} .b{stroke:%23f5bd6a} }%3C/style%3E%3Cg fill='none' stroke-linecap='round' transform='translate(64,64) scale(1.24) translate(-64,-64)'%3E%3Cg class='a' stroke-width='13'%3E%3Cpath d='M50 26L42 106'/%3E%3Cpath d='M90 22L82 102'/%3E%3C/g%3E%3Cg class='a' stroke-width='15'%3E%3Cpath d='M22 88L106 76'/%3E%3Cpath d='M22 56L58 51'/%3E%3C/g%3E%3Cpath class='b' stroke-width='15' d='M68 60L106 55'/%3E%3C/g%3E%3C/svg%3E">
<script>
    (function() {
        var stored = null;
        try {
            stored = localStorage.getItem('sharpdetect-theme');
        } catch (e) {
            // Storage can be unavailable - fall back to the system preference
        }

        var dark = stored === 'dark' || (stored !== 'light' &&
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
</script>
